<svg width="375" height="812" viewBox="0 0 375 812" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bold { font-family: 'Plus Jakarta Sans', Arial, sans-serif; font-weight: 800; }
    .semi { font-family: 'Plus Jakarta Sans', Arial, sans-serif; font-weight: 600; }
    .regular { font-family: 'Plus Jakarta Sans', Arial, sans-serif; font-weight: 400; }
  </style>

  <rect width="375" height="812" fill="#ffffff"/>

  <!-- Header Background (#1a5e35, height 220dp) -->
  <rect width="375" height="220" fill="#1a5e35"/>

  <!-- Status Bar White -->
  <text x="24" y="28" class="bold" font-size="14" fill="#ffffff">9:41</text>
  <path d="M312 24h3v6h-3zm5-2h3v8h-3zm5-3h3v11h-3zm5-3h3v14h-3z" fill="#ffffff"/>
  <path d="M335 17a12 12 0 0 1 12 0l-6 8z" fill="#ffffff"/>
  <rect x="345" y="18" width="20" height="10" rx="3" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="347" y="20" width="13" height="6" rx="1.5" fill="#ffffff"/>
  <path d="M366 21v4" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Title in Header -->
  <text x="187" y="105" class="bold" font-size="22" fill="#ffffff" text-anchor="middle">Digitalisasi Pelayanan</text>
  <text x="187" y="133" class="bold" font-size="22" fill="#ffffff" text-anchor="middle">Desa Buttu Sawe</text>

  <!-- Login Card (Overlaps header by -40dp at y=180, cornerRadius 16, elevation) -->
  <rect x="24" y="180" width="327" height="520" rx="16" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  
  <text x="48" y="222" class="bold" font-size="20" fill="#1a5e35">Selamat Datang Kembali</text>
  <text x="48" y="244" class="regular" font-size="13" fill="#757575">Masuk untuk melanjutkan layanan digital Anda.</text>

  <!-- Field 1: NIK atau Email -->
  <text x="48" y="284" class="bold" font-size="13" fill="#333333">NIK atau Email</text>
  <rect x="48" y="294" width="279" height="50" rx="12" fill="#F9FAFB" stroke="#2e7d32" stroke-width="1.5"/>
  <circle cx="68" cy="319" r="7" fill="#9E9E9E"/>
  <text x="86" y="325" class="regular" font-size="13" fill="#9E9E9E">Contoh: 1234567890123456</text>

  <!-- Field 2: Kata Sandi -->
  <text x="48" y="375" class="bold" font-size="13" fill="#333333">Kata Sandi</text>
  <rect x="48" y="385" width="279" height="50" rx="12" fill="#F9FAFB" stroke="#e5e7eb" stroke-width="1"/>
  <circle cx="68" cy="410" r="7" fill="#9E9E9E"/>
  <text x="86" y="416" class="regular" font-size="13" fill="#9E9E9E">Masukkan kata sandi Anda</text>
  <circle cx="305" cy="410" r="5" fill="none" stroke="#9E9E9E" stroke-width="1.5"/>

  <!-- CheckBox: Ingat Saya & Lupa Kata Sandi? -->
  <rect x="48" y="455" width="18" height="18" rx="4" fill="#1a5e35"/>
  <path d="M52 464l3 3 7-7" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <text x="74" y="469" class="regular" font-size="13" fill="#757575">Ingat Saya</text>
  <text x="327" y="469" class="bold" font-size="13" fill="#1a5e35" text-anchor="end">Lupa Kata Sandi?</text>

  <!-- Button: MASUK SEKARANG (#cfa03f, cornerRadius 28dp, height 56dp) -->
  <rect x="48" y="505" width="279" height="56" rx="28" fill="#cfa03f"/>
  <text x="187" y="540" class="bold" font-size="15" fill="#ffffff" text-anchor="middle">MASUK SEKARANG</text>

  <!-- Bottom Link: Belum memiliki akun SINDESA? Daftar -->
  <text x="187" y="605" class="regular" font-size="13" fill="#757575" text-anchor="middle">
    Belum memiliki akun SINDESA? <tspan class="bold" fill="#1a5e35">Daftar</tspan>
  </text>

  <!-- Home Indicator -->
  <rect x="120" y="798" width="135" height="4" rx="2" fill="#1f2937" opacity="0.3"/>
</svg>