  <rect x="16" y="460" width="343" height="150" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="32" y="490" class="bold" font-size="15" fill="#1a5e35">Upload Berkas Pendukung</text>
  
  <!-- Upload KTP -->
  <text x="32" y="515" class="bold" font-size="12" fill="#333333">KTP Pemohon (Wajib)</text>
  <rect x="32" y="525" width="110" height="34" rx="6" fill="#ffffff" stroke="#1a5e35" stroke-width="1"/>
