  <!-- Checkbox Agree -->
  <rect x="16" y="625" width="16" height="16" rx="3" fill="#1a5e35"/>
  <path d="M19 632l3 3 6-6" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <text x="38" y="637" class="regular" font-size="11" fill="#4b5563">Saya menyatakan bahwa data di atas adalah benar dan valid.</text>

  <!-- Tombol Kirim Pengajuan (#cfa03f, height 56dp, cornerRadius 12dp) -->
  <rect x="16" y="660" width="343" height="56" rx="12" fill="#cfa03f"/>
  <text x="187" y="694" class="bold" font-size="15" fill="#ffffff" text-anchor="middle">KIRIM PENGAJUAN</text>

  <!-- Home Indicator -->
  <rect x="120" y="798" width="135" height="4" rx="2" fill="#1f2937" opacity="0.3"/>
