  <text x="42" y="186" class="bold" font-size="10" fill="#2e7d32">NIK (16 Digit)</text>

  <!-- Input Nama Lengkap -->
  <rect x="32" y="246" width="311" height="44" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="44" y="273" class="semi" font-size="13" fill="#1f2937">Ahmad Faisal</text>
  <text x="42" y="242" class="regular" font-size="10" fill="#6b7280">Nama Lengkap (Sesuai KTP)</text>

  <!-- Input Tempat & Tanggal Lahir -->
  <rect x="32" y="302" width="150" height="44" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="44" y="329" class="semi" font-size="13" fill="#1f2937">Pinrang</text>

  <rect x="193" y="302" width="150" height="44" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="205" y="329" class="semi" font-size="13" fill="#1f2937">12/08/1990</text>

  <!-- Input Jenis Kelamin & Agama -->
  <rect x="32" y="358" width="150" height="44" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="44" y="385" class="semi" font-size="13" fill="#1f2937">Laki-laki</text>

  <rect x="193" y="358" width="150" height="44" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="205" y="385" class="semi" font-size="13" fill="#1f2937">Islam</text>

  <!-- Input Pekerjaan -->
  <rect x="32" y="414" width="311" height="44" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="44" y="441" class="semi" font-size="13" fill="#1f2937">Wiraswasta</text>

