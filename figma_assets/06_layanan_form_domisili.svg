<svg width="375" height="812" viewBox="0 0 375 812" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="375" height="812" fill="#f4f6f9"/>
  
  <!-- Status Bar -->
  <g id="StatusBar">
    <rect width="375" height="44" fill="none"/>
    <text x="28" y="28" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="14" font-weight="700" fill="#1f2937">9:41</text>
    <!-- Cellular Signal -->
    <path d="M312 24h3v6h-3zm5-2h3v8h-3zm5-3h3v11h-3zm5-3h3v14h-3z" fill="#1f2937"/>
    <!-- Wifi -->
    <path d="M335 17a12 12 0 0 1 12 0l-6 8z" fill="#1f2937"/>
    <!-- Battery -->
    <rect x="345" y="18" width="20" height="10" rx="3" fill="none" stroke="#1f2937" stroke-width="1.5"/>
    <rect x="347" y="20" width="13" height="6" rx="1.5" fill="#1f2937"/>
    <path d="M366 21v4" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
  </g>


  <!-- Header -->
  <g id="HeaderBar" transform="translate(20, 52)">
    <circle cx="18" cy="18" r="18" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <path d="M21 12l-6 6 6 6" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <text x="50" y="24" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="17" font-weight="800" fill="#1f2937">Pengajuan Surat Domisili</text>
  </g>

  <!-- Progress Bar Stepper -->
  <g id="Stepper" transform="translate(20, 105)">
    <rect width="335" height="4" rx="2" fill="#e5e7eb"/>
    <rect width="220" height="4" rx="2" fill="#1a5e35"/>
    <circle cx="20" cy="2" r="10" fill="#1a5e35"/>
    <text x="20" y="5" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <circle cx="167" cy="2" r="10" fill="#1a5e35"/>
    <text x="167" y="5" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <circle cx="315" cy="2" r="10" fill="#e5e7eb"/>
    <text x="315" y="5" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="9" font-weight="700" fill="#9ca3af" text-anchor="middle">3</text>
  </g>

  <!-- Form Body Scroll Container -->
  <g id="FormBody" transform="translate(20, 135)">
    <!-- Readonly Info Box -->
    <rect width="335" height="70" rx="12" fill="#e8f5e9" stroke="#c8e6c9" stroke-width="1"/>
    <text x="16" y="28" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="12" font-weight="700" fill="#1a5e35">Data Pemohon (Otomatis)</text>
    <text x="16" y="46" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="12" font-weight="500" fill="#2e7d32">Ahmad Faisal • NIK: 7315041208900001</text>

    <!-- Field 1: Dusun / Alamat -->
    <text x="0" y="100" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="12" font-weight="700" fill="#374151">DUSUN / ALAMAT DOMISILI</text>
    <rect y="110" width="335" height="46" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
    <text x="16" y="138" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="13" font-weight="500" fill="#1f2937">Dusun Kamali RT 002 / RW 001</text>

    <!-- Field 2: Keperluan -->
    <text x="0" y="180" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="12" font-weight="700" fill="#374151">KEPERLUAN SURAT</text>
    <rect y="190" width="335" height="70" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
    <text x="16" y="215" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="13" font-weight="400" fill="#1f2937">Untuk kelengkapan berkas pendaftaran</text>
    <text x="16" y="235" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="13" font-weight="400" fill="#1f2937">pekerjaan di Kabupaten Pinrang</text>

    <!-- Upload Dokumen Box (KTP & KK) -->
    <text x="0" y="285" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="12" font-weight="700" fill="#374151">LAMPIRAN FOTO KTP / KK</text>
    <rect y="295" width="335" height="85" rx="12" fill="#fafafa" stroke="#1a5e35" stroke-width="1.5" stroke-dasharray="6 4"/>
    <circle cx="167" cy="325" r="16" fill="#e8f5e9"/>
    <path d="M167 318v14M160 325l7-7 7 7" stroke="#1a5e35" stroke-width="2" stroke-linecap="round"/>
    <text x="167" y="360" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="11" font-weight="600" fill="#1a5e35" text-anchor="middle">Unggah Berkas Pendukung (JPG/PNG max 2MB)</text>

    <!-- Checkbox Statement -->
    <rect y="405" width="18" height="18" rx="4" fill="#1a5e35"/>
    <path d="M4 9l3 3 7-7" stroke="#ffffff" stroke-width="2" stroke-linecap="round" transform="translate(0, 405)"/>
    <text x="28" y="418" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="11" font-weight="400" fill="#4b5563">Saya menyatakan bahwa data yang diisi adalah</text>
    <text x="28" y="432" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="11" font-weight="700" fill="#1a5e35">benar &amp; dapat dipertanggungjawabkan secara hukum.</text>

    <!-- Submit Button -->
    <rect y="460" width="335" height="50" rx="25" fill="#1a5e35"/>
    <text x="167" y="491" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">KIRIM PENGAJUAN SURAT</text>
  </g>

  
  <!-- Home Indicator Bar -->
  <g id="HomeIndicator">
    <rect x="120" y="798" width="135" height="4" rx="2" fill="#1f2937" opacity="0.3"/>
  </g>

</svg>