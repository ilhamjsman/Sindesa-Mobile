  <rect x="20" y="552" width="160" height="115" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <circle cx="100" cy="587" r="20" fill="#e8f5e9"/>
  <path d="M94 582h12v12H94zM97 586h6" stroke="#1a5e35" stroke-width="2"/>
