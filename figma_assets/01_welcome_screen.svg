  <text x="100" y="641" class="bold" font-size="12" fill="#1a5e35" text-anchor="middle">Umum</text>

  <!-- Card 4: Layanan Sosial -->
  <rect x="195" y="552" width="160" height="115" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <circle cx="275" cy="587" r="20" fill="#e8f5e9"/>
  <path d="M268 592c0-3.5 3.5-5.5 7-5.5s7 2 7 5.5M275 583a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" fill="#1a5e35"/>
