  <text x="145" y="202" class="bold" font-size="18" fill="#ffffff">PELAYANAN DESA</text>
  <text x="145" y="226" class="regular" font-size="11" fill="#E0E0E0">Mewujudkan administrasi digital</text>
  <text x="145" y="240" class="regular" font-size="11" fill="#E0E0E0">yang cepat dan mudah diakses.</text>

