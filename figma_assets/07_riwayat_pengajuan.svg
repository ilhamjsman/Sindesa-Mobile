<svg width="375" height="812" viewBox="0 0 375 812" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="375" height="812" fill="#f4f6f9"/>
  
  <!-- Status Bar -->
  <g id="StatusBar">
    <rect width="375" height="44" fill="none"/>
    <text x="28" y="28" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="14" font-weight="700" fill="#1f2937">9:41</text>
    <!-- Cellular Signal -->
    <path d="M312 24h3v6h-3zm5-2h3v8h-3zm5-3h3v11h-3zm5-3h3v14h-3z" fill="#1f2937"/>
    <!-- Wifi -->
    <path d="M335 17a12 12 0 0 1 12 0l-6 8z" fill="#1f2937"/>
    <!-- Battery -->
    <rect x="345" y="18" width="20" height="10" rx="3" fill="none" stroke="#1f2937" stroke-width="1.5"/>
    <rect x="347" y="20" width="13" height="6" rx="1.5" fill="#1f2937"/>
    <path d="M366 21v4" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
  </g>


  <!-- Header -->
  <g id="Header" transform="translate(20, 52)">
    <circle cx="18" cy="18" r="18" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <path d="M21 12l-6 6 6 6" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <text x="50" y="24" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="18" font-weight="800" fill="#1f2937">Riwayat Pengajuan</text>
  </g>

  <!-- Filter Tabs -->
  <g id="FilterTabs" transform="translate(20, 105)">
    <!-- Tab 1: Semua (Active) -->
    <rect width="75" height="34" rx="17" fill="#1a5e35"/>
    <text x="37" y="22" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Semua</text>

    <!-- Tab 2: Proses -->
    <rect x="85" width="85" height="34" rx="17" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="127" y="22" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle">Diproses</text>

    <!-- Tab 3: Selesai -->
    <rect x="180" width="80" height="34" rx="17" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="220" y="22" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle">Selesai</text>

    <!-- Tab 4: Ditolak -->
    <rect x="270" width="65" height="34" rx="17" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="302" y="22" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle">Ditolak</text>
  </g>

  <!-- Card List -->
  <g id="CardList" transform="translate(20, 155)">
    <!-- Card 1: Selesai -->
    <rect width="335" height="135" rx="16" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="18" y="32" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="15" font-weight="800" fill="#1f2937">Surat Keterangan Domisili</text>
    <text x="18" y="52" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="11" font-weight="500" fill="#6b7280">No: 470/12/DS-BS/VIII/2026</text>
    <text x="18" y="70" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="11" font-weight="400" fill="#9ca3af">17 Agustus 2026 • 14:30 WITA</text>
    
    <!-- Status Badge -->
    <rect x="245" y="16" width="72" height="24" rx="12" fill="#d1fae5"/>
    <text x="281" y="32" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">SELESAI</text>
    
    <!-- Button Preview PDF -->
    <rect x="18" y="88" width="299" height="34" rx="17" fill="#1a5e35"/>
    <text x="167" y="110" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">📄 Lihat &amp; Cetak Surat PDF</text>

    <!-- Card 2: Diproses -->
    <g transform="translate(0, 150)">
      <rect width="335" height="105" rx="16" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
      <text x="18" y="32" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="15" font-weight="800" fill="#1f2937">Surat Keterangan Usaha</text>
      <text x="18" y="52" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="11" font-weight="500" fill="#6b7280">No: Menunggu Penomoran</text>
      <text x="18" y="70" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="11" font-weight="400" fill="#9ca3af">16 Agustus 2026 • 09:15 WITA</text>
      
      <rect x="215" y="16" width="102" height="24" rx="12" fill="#dbeafe"/>
      <text x="266" y="32" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="10" font-weight="700" fill="#1e40af" text-anchor="middle">DIPROSES KADES</text>
      
      <text x="18" y="92" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="11" font-weight="600" fill="#cfa03f">⏳ Sedang menunggu tanda tangan digital Kepala Desa</text>
    </g>

    <!-- Card 3: Menunggu Verifikasi -->
    <g transform="translate(0, 270)">
      <rect width="335" height="105" rx="16" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
      <text x="18" y="32" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="15" font-weight="800" fill="#1f2937">Surat Ket. Tidak Mampu</text>
      <text x="18" y="52" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="11" font-weight="500" fill="#6b7280">No: -</text>
      <text x="18" y="70" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="11" font-weight="400" fill="#9ca3af">14 Agustus 2026 • 11:00 WITA</text>
      
      <rect x="235" y="16" width="82" height="24" rx="12" fill="#fef3c7"/>
      <text x="276" y="32" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">VERIFIKASI</text>
      
      <text x="18" y="92" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="11" font-weight="600" fill="#6b7280">🔍 Sedang diverifikasi oleh Operator Desa</text>
    </g>
  </g>

  
  <!-- Home Indicator Bar -->
  <g id="HomeIndicator">
    <rect x="120" y="798" width="135" height="4" rx="2" fill="#1f2937" opacity="0.3"/>
  </g>

</svg>