<svg width="375" height="812" viewBox="0 0 375 812" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="375" height="812" fill="#f4f6f9"/>
  
  <g id="StatusBar">
    <rect width="375" height="44" fill="none"/>
    <text x="28" y="28" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="14" font-weight="700" fill="#1f2937">9:41</text>
    <path d="M312 24h3v6h-3zm5-2h3v8h-3zm5-3h3v11h-3zm5-3h3v14h-3z" fill="#1f2937"/>
    <path d="M335 17a12 12 0 0 1 12 0l-6 8z" fill="#1f2937"/>
    <rect x="345" y="18" width="20" height="10" rx="3" fill="none" stroke="#1f2937" stroke-width="1.5"/>
    <rect x="347" y="20" width="13" height="6" rx="1.5" fill="#1f2937"/>
    <path d="M366 21v4" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
  </g>


  <!-- Header -->
  <g id="RegisterHeader" transform="translate(20, 52)">
    <circle cx="18" cy="18" r="18" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <path d="M21 12l-6 6 6 6" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <text x="50" y="24" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="18" font-weight="800" fill="#1f2937">Registrasi Akun Warga</text>
  </g>

  <!-- Register Card -->
  <g id="RegisterCard" transform="translate(20, 105)">
    <rect width="335" height="640" rx="20" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>

    <!-- Field 1: NIK -->
    <text x="20" y="32" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="11" font-weight="700" fill="#374151">NOMOR INDUK KEPENDUDUKAN (NIK)</text>
    <rect x="20" y="42" width="295" height="44" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
    <text x="36" y="69" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="13" font-weight="400" fill="#9ca3af">16 Digit NIK sesuai KTP</text>

    <!-- Field 2: Nama Lengkap -->
    <text x="20" y="106" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="11" font-weight="700" fill="#374151">NAMA LENGKAP</text>
    <rect x="20" y="116" width="295" height="44" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
    <text x="36" y="143" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="13" font-weight="400" fill="#9ca3af">Nama lengkap tanpa singkatan</text>

    <!-- Field 3: WhatsApp / HP -->
    <text x="20" y="180" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="11" font-weight="700" fill="#374151">NOMOR WHATSAPP</text>
    <rect x="20" y="190" width="295" height="44" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
    <text x="36" y="217" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="13" font-weight="400" fill="#9ca3af">08xxxxxxxxxx</text>

    <!-- Field 4: Upload Foto KTP Asli -->
    <text x="20" y="254" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="11" font-weight="700" fill="#374151">FOTO KTP ASLI (VERIFIKASI PDP)</text>
    <rect x="20" y="264" width="295" height="75" rx="12" fill="#fafafa" stroke="#cfa03f" stroke-width="1.5" stroke-dasharray="5 3"/>
    <circle cx="167" cy="292" r="14" fill="#fef3c7"/>
    <path d="M167 286v12M161 292l6-6 6 6" stroke="#cfa03f" stroke-width="2" stroke-linecap="round"/>
    <text x="167" y="324" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="10.5" font-weight="600" fill="#cfa03f" text-anchor="middle">Ambil Foto KTP Asli (Jelas &amp; Terbaca)</text>

    <!-- Field 5: Password -->
    <text x="20" y="360" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="11" font-weight="700" fill="#374151">KATA SANDI</text>
    <rect x="20" y="370" width="295" height="44" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
    <text x="36" y="397" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="14" font-weight="600" fill="#374151">••••••••••••</text>

    <!-- Field 6: Konfirmasi Password -->
    <text x="20" y="434" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="11" font-weight="700" fill="#374151">KONFIRMASI KATA SANDI</text>
    <rect x="20" y="444" width="295" height="44" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
    <text x="36" y="471" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="14" font-weight="600" fill="#374151">••••••••••••</text>

    <!-- Button Daftar -->
    <rect x="20" y="510" width="295" height="48" rx="24" fill="#cfa03f"/>
    <text x="167" y="540" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">DAFTAR AKUN SEKARANG</text>

    <!-- Login Link -->
    <text x="167" y="585" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle">
      Sudah punya akun? <tspan font-weight="700" fill="#1a5e35">Masuk di sini</tspan>
    </text>

    <text x="167" y="615" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="9.5" font-weight="500" fill="#9ca3af" text-anchor="middle">Data PII terlindungi enkripsi standar UU PDP</text>
  </g>

  
  <g id="HomeIndicator">
    <rect x="120" y="798" width="135" height="4" rx="2" fill="#1f2937" opacity="0.3"/>
  </g>

</svg>