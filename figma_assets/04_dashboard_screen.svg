<svg width="375" height="812" viewBox="0 0 375 812" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dash-card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a5e35"/>
      <stop offset="100%" stop-color="#124124"/>
    </linearGradient>
  </defs>

  <rect width="375" height="812" fill="#f4f6f9"/>
  
  <!-- Status Bar -->
  <g id="StatusBar">
    <rect width="375" height="44" fill="none"/>
    <text x="28" y="28" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="14" font-weight="700" fill="#1f2937">9:41</text>
    <!-- Cellular Signal -->
    <path d="M312 24h3v6h-3zm5-2h3v8h-3zm5-3h3v11h-3zm5-3h3v14h-3z" fill="#1f2937"/>
    <!-- Wifi -->
    <path d="M335 17a12 12 0 0 1 12 0l-6 8z" fill="#1f2937"/>
    <!-- Battery -->
    <rect x="345" y="18" width="20" height="10" rx="3" fill="none" stroke="#1f2937" stroke-width="1.5"/>
    <rect x="347" y="20" width="13" height="6" rx="1.5" fill="#1f2937"/>
    <path d="M366 21v4" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
  </g>


  <!-- App Bar -->
  <g id="AppBar" transform="translate(20, 52)">
    <!-- Hamburger Button -->
    <rect width="36" height="36" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <path d="M10 13h16M10 18h16M10 23h16" stroke="#1a5e35" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Village Name & Location -->
    <text x="48" y="16" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="15" font-weight="800" fill="#1a5e35">Desa Buttu Sawe</text>
    <text x="48" y="30" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="11" font-weight="500" fill="#6b7280">Kec. Duampanua, Pinrang</text>

    <!-- Notification Bell -->
    <circle cx="295" cy="18" r="18" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <path d="M290 22h10l-2-3v-4a3 3 0 0 0-6 0v4z" fill="#1a5e35"/>
    <circle cx="300" cy="10" r="4" fill="#ef4444"/>

    <!-- Avatar -->
    <circle cx="335" cy="18" r="18" fill="#cfa03f"/>
    <text x="335" y="23" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">AF</text>
  </g>

  <!-- Welcome Citizen Card -->
  <g id="CitizenCard" transform="translate(20, 108)">
    <rect width="335" height="135" rx="18" fill="url(#dash-card-grad)"/>
    <circle cx="300" cy="40" r="60" fill="rgba(255,255,255,0.05)"/>
    <circle cx="260" cy="120" r="50" fill="rgba(207,160,63,0.1)"/>
    
    <text x="22" y="34" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="13" font-weight="500" fill="#e0e0e0">Selamat Datang,</text>
    <text x="22" y="60" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="20" font-weight="800" fill="#ffffff">Ahmad Faisal</text>
    <text x="22" y="82" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="12" font-weight="400" fill="#cfa03f">NIK: 7315041208900001</text>
    
    <!-- Verified Badge -->
    <rect x="22" y="96" width="140" height="24" rx="12" fill="rgba(255,255,255,0.15)"/>
    <text x="92" y="112" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">✓ Warga Terverifikasi</text>
  </g>

  <!-- Stats Row (3 Badges) -->
  <g id="StatsRow" transform="translate(20, 255)">
    <!-- Menunggu -->
    <rect width="105" height="65" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="16" y="24" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="11" font-weight="600" fill="#6b7280">Menunggu</text>
    <text x="16" y="50" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="22" font-weight="800" fill="#f59e0b">1</text>

    <!-- Diproses -->
    <rect x="115" width="105" height="65" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="131" y="24" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="11" font-weight="600" fill="#6b7280">Diproses</text>
    <text x="131" y="50" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="22" font-weight="800" fill="#3b82f6">2</text>

    <!-- Selesai -->
    <rect x="230" width="105" height="65" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="246" y="24" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="11" font-weight="600" fill="#6b7280">Selesai</text>
    <text x="246" y="50" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="22" font-weight="800" fill="#10b981">5</text>
  </g>

  <!-- Layanan Surat Grid Section -->
  <text x="20" y="348" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="16" font-weight="800" fill="#1f2937">Layanan Surat Online</text>
  <text x="355" y="348" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="12" font-weight="700" fill="#1a5e35" text-anchor="end">Lihat Semua</text>

  <!-- 8 Service Icons Grid -->
  <g id="MenuGrid" transform="translate(20, 365)">
    <!-- 1. Domisili -->
    <g transform="translate(0, 0)">
      <circle cx="36" cy="36" r="28" fill="#e8f5e9"/>
      <path d="M28 42v-8l8-6 8 6v8h-5v-5h-6v5z" fill="#1a5e35"/>
      <text x="36" y="78" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="11" font-weight="700" fill="#374151" text-anchor="middle">Domisili</text>
    </g>

    <!-- 2. KTP -->
    <g transform="translate(85, 0)">
      <circle cx="36" cy="36" r="28" fill="#eff6ff"/>
      <rect x="24" y="24" width="24" height="16" rx="3" fill="#3b82f6"/>
      <circle cx="31" cy="30" r="2.5" fill="#ffffff"/>
      <text x="36" y="78" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="11" font-weight="700" fill="#374151" text-anchor="middle">KTP Baru</text>
    </g>

    <!-- 3. KK -->
    <g transform="translate(170, 0)">
      <circle cx="36" cy="36" r="28" fill="#fef3c7"/>
      <path d="M28 40c0-3 3-5 6-5s6 2 6 5M34 32a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z" fill="#cfa03f"/>
      <text x="36" y="78" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="11" font-weight="700" fill="#374151" text-anchor="middle">Kartu Keluarga</text>
    </g>

    <!-- 4. SKTM -->
    <g transform="translate(255, 0)">
      <circle cx="36" cy="36" r="28" fill="#fdf2f8"/>
      <path d="M26 36h20v6H26zM36 24v12" stroke="#db2777" stroke-width="2"/>
      <text x="36" y="78" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="11" font-weight="700" fill="#374151" text-anchor="middle">SKTM</text>
    </g>

    <!-- 5. Usaha -->
    <g transform="translate(0, 95)">
      <circle cx="36" cy="36" r="28" fill="#fef3c7"/>
      <path d="M24 30h24v14H24zM30 30v-4h12v4" fill="none" stroke="#d97706" stroke-width="2"/>
      <text x="36" y="78" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="11" font-weight="700" fill="#374151" text-anchor="middle">Usaha</text>
    </g>

    <!-- 6. SKCK -->
    <g transform="translate(85, 95)">
      <circle cx="36" cy="36" r="28" fill="#f5f3ff"/>
      <path d="M36 24l10 4v8c0 6-10 10-10 10s-10-4-10-10v-8z" fill="#7c3aed"/>
      <text x="36" y="78" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="11" font-weight="700" fill="#374151" text-anchor="middle">SKCK</text>
    </g>

    <!-- 7. Kelahiran -->
    <g transform="translate(170, 95)">
      <circle cx="36" cy="36" r="28" fill="#ecfdf5"/>
      <circle cx="36" cy="32" r="5" fill="#059669"/>
      <path d="M28 42c0-4 4-6 8-6s8 2 8 6" fill="#059669"/>
      <text x="36" y="78" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="11" font-weight="700" fill="#374151" text-anchor="middle">Kelahiran</text>
    </g>

    <!-- 8. Kematian -->
    <g transform="translate(255, 95)">
      <circle cx="36" cy="36" r="28" fill="#f3f4f6"/>
      <path d="M34 26h4v20h-4zM28 32h16v4H28z" fill="#4b5563"/>
      <text x="36" y="78" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="11" font-weight="700" fill="#374151" text-anchor="middle">Kematian</text>
    </g>
  </g>

  <!-- Recent Letter Card -->
  <g id="RecentSurat" transform="translate(20, 575)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="15" font-weight="800" fill="#1f2937">Pengajuan Terakhir</text>
    
    <rect y="12" width="335" height="74" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <circle cx="32" cy="49" r="18" fill="#e8f5e9"/>
    <path d="M28 53v-6l4-3 4 3v6z" fill="#1a5e35"/>

    <text x="60" y="42" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="13" font-weight="700" fill="#1f2937">Surat Keterangan Domisili</text>
    <text x="60" y="58" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="11" font-weight="400" fill="#6b7280">17 Agustus 2026 • 14:30 WITA</text>

    <!-- Selesai Badge -->
    <rect x="250" y="35" width="70" height="24" rx="12" fill="#d1fae5"/>
    <text x="285" y="51" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">SELESAI</text>
  </g>

  <!-- Bottom Navigation Bar -->
  <g id="BottomNavBar" transform="translate(0, 720)">
    <rect width="375" height="92" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    
    <!-- Tab 1: Beranda (Active) -->
    <g transform="translate(45, 12)">
      <path d="M12 4L3 11v9h6v-6h6v6h6v-9z" fill="#1a5e35"/>
      <text x="12" y="32" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="10" font-weight="700" fill="#1a5e35" text-anchor="middle">Beranda</text>
    </g>

    <!-- Tab 2: Layanan -->
    <g transform="translate(130, 12)">
      <path d="M4 6h16v12H4zM8 10h8" stroke="#9ca3af" stroke-width="2"/>
      <text x="12" y="32" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="10" font-weight="500" fill="#9ca3af" text-anchor="middle">Layanan</text>
    </g>

    <!-- Tab 3: Riwayat -->
    <g transform="translate(215, 12)">
      <path d="M12 4a8 8 0 1 0 8 8h-3" stroke="#9ca3af" stroke-width="2" fill="none"/>
      <text x="12" y="32" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="10" font-weight="500" fill="#9ca3af" text-anchor="middle">Riwayat</text>
    </g>

    <!-- Tab 4: Profil -->
    <g transform="translate(300, 12)">
      <circle cx="12" cy="8" r="4" stroke="#9ca3af" stroke-width="2" fill="none"/>
      <path d="M5 20c0-4 3.5-6 7-6s7 2 7 6" stroke="#9ca3af" stroke-width="2" fill="none"/>
      <text x="12" y="32" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="10" font-weight="500" fill="#9ca3af" text-anchor="middle">Profil</text>
    </g>
  </g>

  
  <!-- Home Indicator Bar -->
  <g id="HomeIndicator">
    <rect x="120" y="798" width="135" height="4" rx="2" fill="#1f2937" opacity="0.3"/>
  </g>

</svg>